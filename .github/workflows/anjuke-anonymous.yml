name: anjuke-anonymous-live

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Anonymous diagnostic scenario'
        type: choice
        default: cloud-entry
        options: [cloud-entry, slider-once, verify-ui, public-mobile, sdk-fallback]
  push:
    branches: ['codex/anonymous-anjuke']
    paths:
      - '.github/workflows/anjuke-anonymous.yml'
      - 'data_processing/anjuke_anonymous.py'
      - 'data_processing/test_anjuke_anonymous.py'
      - 'data_processing/anjuke_slider_probe.py'
      - 'data_processing/test_anjuke_slider_probe.py'
      - 'data_processing/market_crawler.py'
      - 'data_processing/test_anjuke_mobile.py'
      - 'data_processing/fixtures/anjuke_mobile_list.html'

permissions:
  contents: read

concurrency:
  group: anjuke-anonymous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: data_processing
      DIAGNOSTIC_MODE: ${{ inputs.mode || 'cloud-entry' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare fresh anonymous runner
        run: |
          python -m pip install -r requirements-crawl.txt
          python -m playwright install --with-deps chromium
      - name: Verify acceptance rules
        run: python -m unittest test_anjuke_anonymous test_anjuke_slider_probe test_anjuke_mobile test_market
      - name: Fetch actual public pages without imported sessions
        run: |
          case "$DIAGNOSTIC_MODE" in
            cloud-entry)
              xvfb-run -a python data_processing/cloud_crawl.py --crawler anjuke_anonymous --args-json '[]'
              ;;
            slider-once)
              xvfb-run -a python data_processing/anjuke_anonymous.py --browser-only --headed --solve-slider --targets beijing_year,beijing_communities,beijing_properties,beijing_mobile_properties
              ;;
            public-mobile)
              xvfb-run -a python data_processing/anjuke_anonymous.py --browser-only --headed --targets beijing_year,beijing_communities,beijing_mobile_properties,beijing_mobile_home,beijing_mobile_trend
              ;;
            sdk-fallback)
              xvfb-run -a python data_processing/anjuke_anonymous.py --browser-only --headed --sdk-fallback --targets beijing_year,beijing_communities,beijing_properties
              ;;
            verify-ui)
              xvfb-run -a python data_processing/anjuke_anonymous.py --browser-only --headed --activate-challenge --targets beijing_year,beijing_communities,beijing_properties,beijing_mobile_properties
              ;;
            *) exit 2 ;;
          esac
      - name: Retain live evidence even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anjuke-anonymous-${{ github.run_id }}
          path: output/anjuke_anonymous/
          retention-days: 7
